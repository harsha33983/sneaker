<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <circle cx="400" cy="300" r="220" fill="#181818" opacity="0.6"/>
  <circle cx="400" cy="300" r="160" fill="#f43f5e" opacity="0.05" filter="url(#glow3)"/>
  
  <!-- Silhouette of Shadow Runner Pro -->
  <g transform="translate(90, 130)">
    <ellipse cx="310" cy="335" rx="280" ry="25" fill="#000" opacity="0.85" filter="url(#glow3)"/>
    
    <!-- Triple Black Chunky Aggressive Sole -->
    <path d="M 40,290 C 130,295 240,305 350,300 C 440,295 530,310 570,270 C 580,250 560,240 530,245 C 440,260 360,255 270,255 C 180,255 80,260 40,285 Z" fill="#171717" stroke="#333" stroke-width="2"/>
    <path d="M 60,305 C 150,315 280,310 400,315 C 480,315 540,295 560,280" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Carbon Fiber Upper Plate -->
    <path d="M 40,285 C 90,230 170,210 240,190 C 300,175 350,140 400,110 C 430,95 460,120 470,165 C 480,205 510,230 530,245 C 440,260 360,255 270,255 C 180,255 80,260 40,285 Z" fill="#1f1f1f" stroke="#444" stroke-width="2"/>
    
    <!-- Geometric stealth panels -->
    <polygon points="200,210 280,195 340,225 240,240" fill="#292929" stroke="#555" stroke-width="1"/>
    <polygon points="290,190 380,160 410,195 350,220" fill="#242424" stroke="#555" stroke-width="1"/>
    
    <!-- Red Accent Mark -->
    <line x1="430" y1="130" x2="455" y2="155" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <text x="50" y="80" fill="#F5F3EE" font-family="sans-serif" font-weight="900" font-size="28" letter-spacing="4">SHADOW RUNNER PRO</text>
  <text x="50" y="110" fill="#f43f5e" font-family="sans-serif" font-weight="600" font-size="14" letter-spacing="2">EDITION 003 // ALL BLACK VAULT</text>
  <text x="750" y="550" text-anchor="end" fill="#555" font-family="sans-serif" font-size="14" letter-spacing="2">SOLD OUT ARCHIVE</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151719" />
      <stop offset="100%" stop-color="#0e1012" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <circle cx="400" cy="300" r="220" fill="#1c2024" opacity="0.6"/>
  <circle cx="400" cy="300" r="160" fill="#38bdf8" opacity="0.05" filter="url(#glow2)"/>
  
  <!-- Silhouette of Urban Velocity 01 -->
  <g transform="translate(100, 130)">
    <ellipse cx="300" cy="330" rx="270" ry="25" fill="#000" opacity="0.75" filter="url(#glow2)"/>
    
    <!-- Sculpted Runner Sole -->
    <path d="M 50,290 C 130,295 240,285 360,305 C 430,315 520,300 560,265 C 570,250 560,240 540,245 C 470,265 370,250 280,255 C 190,260 90,255 50,280 Z" fill="#262626" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 120,290 C 200,285 280,290 350,300" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Breathable Knit Upper -->
    <path d="M 50,280 C 100,225 180,215 250,195 C 310,180 370,165 420,135 C 450,120 480,140 485,180 C 490,210 520,235 540,245 C 470,265 370,250 280,255 C 190,260 90,255 50,280 Z" fill="#1e2229" stroke="#3a424e" stroke-width="2"/>
    
    <!-- Dynamic Speed Overlays -->
    <path d="M 210,210 C 270,195 350,190 410,220 C 370,230 280,235 210,210 Z" fill="#38bdf8" opacity="0.85"/>
    <path d="M 270,185 C 330,175 390,170 440,190 C 410,205 340,205 270,185 Z" fill="#D7FF45" opacity="0.9"/>
  </g>
  
  <text x="50" y="80" fill="#F5F3EE" font-family="sans-serif" font-weight="900" font-size="28" letter-spacing="4">URBAN VELOCITY 01</text>
  <text x="50" y="110" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="14" letter-spacing="2">EDITION 002 // SPEED ARCHIVE</text>
  <text x="750" y="550" text-anchor="end" fill="#555" font-family="sans-serif" font-size="14" letter-spacing="2">LIMITED RUN - 250 PAIRS</text>
</svg>

